# DataMind evaluation set — TPC-H, development split.
#
# Every data question has hand-written gold SQL, written independently of the agent. The harness runs
# the gold SQL on a gold engine and compares the agent's result with result-set equivalence
# (column names/order, row order and small rounding differences don't matter; extra helper columns
# in the agent's result are allowed).
#
# Gold SQL deliberately selects only the columns that define the answer: the measure(s), plus a label
# only when its format is unambiguous (names, keys, years). Time-series items select the measure only
# and set `ordered: true`, so '1996-01-01' vs 'Q1' vs 1 label formats don't matter.
#
# This file doubles as the verified-example library for few-shot prompting. During evaluation the
# item under test is excluded (leave-one-out), so the agent never sees its own gold SQL.
# The HOLD-OUT set must live in a separate file written by a teammate who never edits prompts.
#
# Fields: id, tier, question, paraphrases, gold_sql | expect, ordered, percent
dataset: tpch
items:
  # ------------------------------------------------------------------ single table
  - id: s01
    tier: single_table
    question: How many orders were placed in 1995?
    paraphrases:
      - "What was the number of orders in 1995?"
      - "Count of orders with an order date in 1995"
    gold_sql: |
      SELECT COUNT(*) AS order_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      WHERE orders.o_orderdate BETWEEN DATE '1995-01-01' AND DATE '1995-12-31'

  - id: s02
    tier: single_table
    question: How many customers are in the AUTOMOBILE market segment?
    paraphrases:
      - "Number of automobile-segment customers?"
    gold_sql: |
      SELECT COUNT(*) AS customer_count
      FROM DATAMIND_DB.TPCH.CUSTOMER AS customer
      WHERE customer.c_mktsegment = 'AUTOMOBILE'

  - id: s03
    tier: single_table
    question: What is the average account balance of customers in the MACHINERY segment?
    paraphrases:
      - "Average balance for machinery customers"
    gold_sql: |
      SELECT AVG(customer.c_acctbal) AS avg_account_balance
      FROM DATAMIND_DB.TPCH.CUSTOMER AS customer
      WHERE customer.c_mktsegment = 'MACHINERY'

  - id: s04
    tier: single_table
    question: How many parts have size 15?
    gold_sql: |
      SELECT COUNT(*) AS part_count FROM DATAMIND_DB.TPCH.PART AS part WHERE part.p_size = 15

  - id: s05
    tier: single_table
    question: How many urgent-priority orders are still open?
    paraphrases:
      - "Number of open orders with priority 1-URGENT"
    gold_sql: |
      SELECT COUNT(*) AS order_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      WHERE orders.o_orderpriority = '1-URGENT' AND orders.o_orderstatus = 'O'

  - id: s06
    tier: single_table
    question: What is the total quantity of units shipped by RAIL?
    paraphrases:
      - "How many units went by rail in total?"
    gold_sql: |
      SELECT SUM(lineitem.l_quantity) AS units
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      WHERE lineitem.l_shipmode = 'RAIL'

  - id: s07
    tier: single_table
    question: How many suppliers have a negative account balance?
    gold_sql: |
      SELECT COUNT(*) AS supplier_count FROM DATAMIND_DB.TPCH.SUPPLIER AS supplier WHERE supplier.s_acctbal < 0

  - id: s08
    tier: single_table
    question: What is the highest retail price of any part?
    paraphrases:
      - "Most expensive part list price?"
    gold_sql: |
      SELECT MAX(part.p_retailprice) AS max_retail_price FROM DATAMIND_DB.TPCH.PART AS part

  - id: s09
    tier: single_table
    question: How many order lines were returned?
    paraphrases:
      - "Number of returned line items"
    gold_sql: |
      SELECT COUNT(*) AS returned_lines FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem WHERE lineitem.l_returnflag = 'R'

  - id: s10
    tier: single_table
    question: How many orders are there for each order priority?
    paraphrases:
      - "Break down the number of orders by priority"
    gold_sql: |
      SELECT orders.o_orderpriority, COUNT(*) AS order_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      GROUP BY orders.o_orderpriority

  # ------------------------------------------------------------------ joins
  - id: j01
    tier: join
    question: What was total revenue in 1995?
    paraphrases:
      - "Total net sales for orders placed in 1995"
      - "How much did we sell in 1995?"
    gold_sql: |
      SELECT SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      WHERE orders.o_orderdate BETWEEN DATE '1995-01-01' AND DATE '1995-12-31'

  - id: j02
    tier: join
    question: What was revenue by customer region in 1996?
    paraphrases:
      - "Break down 1996 sales by the region customers are in"
    gold_sql: |
      SELECT cust_region.r_name, SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      JOIN DATAMIND_DB.TPCH.CUSTOMER AS customer ON orders.o_custkey = customer.c_custkey
      JOIN DATAMIND_DB.TPCH.NATION AS cust_nation ON customer.c_nationkey = cust_nation.n_nationkey
      JOIN DATAMIND_DB.TPCH.REGION AS cust_region ON cust_nation.n_regionkey = cust_region.r_regionkey
      WHERE orders.o_orderdate BETWEEN DATE '1996-01-01' AND DATE '1996-12-31'
      GROUP BY cust_region.r_name

  - id: j03
    tier: join
    question: Which 5 customer nations placed the most orders in 1997?
    paraphrases:
      - "Top five countries by number of orders in 1997"
    gold_sql: |
      SELECT cust_nation.n_name, COUNT(*) AS order_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      JOIN DATAMIND_DB.TPCH.CUSTOMER AS customer ON orders.o_custkey = customer.c_custkey
      JOIN DATAMIND_DB.TPCH.NATION AS cust_nation ON customer.c_nationkey = cust_nation.n_nationkey
      WHERE orders.o_orderdate BETWEEN DATE '1997-01-01' AND DATE '1997-12-31'
      GROUP BY cust_nation.n_name
      ORDER BY order_count DESC, cust_nation.n_name
      LIMIT 5

  - id: j04
    tier: join
    question: Which supplier nation supplied the most units for orders placed in 1994?
    paraphrases:
      - "In 1994, suppliers from which country shipped the largest quantity?"
    gold_sql: |
      SELECT supp_nation.n_name, SUM(lineitem.l_quantity) AS units
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      JOIN DATAMIND_DB.TPCH.SUPPLIER AS supplier ON lineitem.l_suppkey = supplier.s_suppkey
      JOIN DATAMIND_DB.TPCH.NATION AS supp_nation ON supplier.s_nationkey = supp_nation.n_nationkey
      WHERE orders.o_orderdate BETWEEN DATE '1994-01-01' AND DATE '1994-12-31'
      GROUP BY supp_nation.n_name
      ORDER BY units DESC
      LIMIT 1

  - id: j05
    tier: join
    question: What is the total revenue from BUILDING-segment customers located in EUROPE?
    paraphrases:
      - "How much revenue came from European customers in the building segment?"
    gold_sql: |
      SELECT SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      JOIN DATAMIND_DB.TPCH.CUSTOMER AS customer ON orders.o_custkey = customer.c_custkey
      JOIN DATAMIND_DB.TPCH.NATION AS cust_nation ON customer.c_nationkey = cust_nation.n_nationkey
      JOIN DATAMIND_DB.TPCH.REGION AS cust_region ON cust_nation.n_regionkey = cust_region.r_regionkey
      WHERE customer.c_mktsegment = 'BUILDING' AND cust_region.r_name = 'EUROPE'

  - id: j06
    tier: join
    question: How many distinct customers from INDIA placed orders in 1998?
    paraphrases:
      - "Number of Indian customers who ordered in 1998"
    gold_sql: |
      SELECT COUNT(DISTINCT customer.c_custkey) AS customer_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      JOIN DATAMIND_DB.TPCH.CUSTOMER AS customer ON orders.o_custkey = customer.c_custkey
      JOIN DATAMIND_DB.TPCH.NATION AS cust_nation ON customer.c_nationkey = cust_nation.n_nationkey
      WHERE cust_nation.n_name = 'INDIA' AND orders.o_orderdate BETWEEN DATE '1998-01-01' AND DATE '1998-12-31'

  - id: j07
    tier: join
    question: What was revenue by ship mode for orders placed in 1995?
    paraphrases:
      - "Split 1995 sales by shipping method"
    gold_sql: |
      SELECT lineitem.l_shipmode, SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      WHERE orders.o_orderdate BETWEEN DATE '1995-01-01' AND DATE '1995-12-31'
      GROUP BY lineitem.l_shipmode

  - id: j08
    tier: join
    question: Who are the top 3 manufacturers by revenue?
    paraphrases:
      - "Which three manufacturers sold the most?"
    gold_sql: |
      SELECT part.p_mfgr, SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.PART AS part ON lineitem.l_partkey = part.p_partkey
      GROUP BY part.p_mfgr
      ORDER BY revenue DESC
      LIMIT 3

  - id: j09
    tier: join
    question: What is the average order value for customers in JAPAN?
    paraphrases:
      - "Average order total of Japanese customers"
    gold_sql: |
      SELECT AVG(orders.o_totalprice) AS avg_order_value
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      JOIN DATAMIND_DB.TPCH.CUSTOMER AS customer ON orders.o_custkey = customer.c_custkey
      JOIN DATAMIND_DB.TPCH.NATION AS cust_nation ON customer.c_nationkey = cust_nation.n_nationkey
      WHERE cust_nation.n_name = 'JAPAN'

  - id: j10
    tier: join
    question: How many line items supplied by suppliers in GERMANY were returned?
    paraphrases:
      - "Count of returned order lines from German suppliers"
    gold_sql: |
      SELECT COUNT(*) AS returned_lines
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.SUPPLIER AS supplier ON lineitem.l_suppkey = supplier.s_suppkey
      JOIN DATAMIND_DB.TPCH.NATION AS supp_nation ON supplier.s_nationkey = supp_nation.n_nationkey
      WHERE supp_nation.n_name = 'GERMANY' AND lineitem.l_returnflag = 'R'

  - id: j11
    tier: join
    question: What is the total value of inventory (supply cost times available quantity) held by suppliers in CANADA?
    paraphrases:
      - "Stock value at cost for Canadian suppliers"
    gold_sql: |
      SELECT SUM(partsupp.ps_supplycost * partsupp.ps_availqty) AS inventory_value
      FROM DATAMIND_DB.TPCH.PARTSUPP AS partsupp
      JOIN DATAMIND_DB.TPCH.SUPPLIER AS supplier ON partsupp.ps_suppkey = supplier.s_suppkey
      JOIN DATAMIND_DB.TPCH.NATION AS supp_nation ON supplier.s_nationkey = supp_nation.n_nationkey
      WHERE supp_nation.n_name = 'CANADA'

  - id: j12
    tier: join
    question: How much revenue did parts whose type contains BRASS generate from orders placed in 1993?
    paraphrases:
      - "1993 sales of brass parts"
    gold_sql: |
      SELECT SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      JOIN DATAMIND_DB.TPCH.PART AS part ON lineitem.l_partkey = part.p_partkey
      WHERE part.p_type ILIKE '%BRASS%' AND orders.o_orderdate BETWEEN DATE '1993-01-01' AND DATE '1993-12-31'

  # ------------------------------------------------------------------ multi-step
  - id: m01
    tier: multi_step
    question: >-
      Pricing summary: for line items shipped on or before 1998-09-02, grouped by return flag and line status,
      give total quantity, total extended price, total discounted price, total charge including tax,
      average quantity, average extended price, average discount and the number of lines.
    gold_sql: |
      SELECT lineitem.l_returnflag, lineitem.l_linestatus,
             SUM(lineitem.l_quantity) AS sum_qty,
             SUM(lineitem.l_extendedprice) AS sum_base_price,
             SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS sum_disc_price,
             SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount) * (1 + lineitem.l_tax)) AS sum_charge,
             AVG(lineitem.l_quantity) AS avg_qty,
             AVG(lineitem.l_extendedprice) AS avg_price,
             AVG(lineitem.l_discount) AS avg_disc,
             COUNT(*) AS count_order
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      WHERE lineitem.l_shipdate <= DATE '1998-09-02'
      GROUP BY lineitem.l_returnflag, lineitem.l_linestatus

  - id: m02
    tier: multi_step
    question: >-
      List the 10 unshipped orders with the highest revenue for BUILDING-segment customers: orders placed before
      1995-03-15 whose lines shipped after 1995-03-15. Show order key, revenue and order date.
    gold_sql: |
      SELECT lineitem.l_orderkey,
             SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue,
             orders.o_orderdate
      FROM DATAMIND_DB.TPCH.CUSTOMER AS customer
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON customer.c_custkey = orders.o_custkey
      JOIN DATAMIND_DB.TPCH.LINEITEM AS lineitem ON lineitem.l_orderkey = orders.o_orderkey
      WHERE customer.c_mktsegment = 'BUILDING'
        AND orders.o_orderdate < DATE '1995-03-15'
        AND lineitem.l_shipdate > DATE '1995-03-15'
      GROUP BY lineitem.l_orderkey, orders.o_orderdate
      ORDER BY revenue DESC, orders.o_orderdate
      LIMIT 10

  - id: m03
    tier: multi_step
    question: For orders placed in 1994 by customers in ASIA, what was revenue by nation counting only lines where the supplier is in the same nation as the customer?
    paraphrases:
      - "Local-supplier revenue by Asian nation in 1994 (customer and supplier in the same country)"
    gold_sql: |
      SELECT cust_nation.n_name, SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      JOIN DATAMIND_DB.TPCH.CUSTOMER AS customer ON orders.o_custkey = customer.c_custkey
      JOIN DATAMIND_DB.TPCH.SUPPLIER AS supplier ON lineitem.l_suppkey = supplier.s_suppkey
      JOIN DATAMIND_DB.TPCH.NATION AS cust_nation ON customer.c_nationkey = cust_nation.n_nationkey
      JOIN DATAMIND_DB.TPCH.REGION AS cust_region ON cust_nation.n_regionkey = cust_region.r_regionkey
      WHERE customer.c_nationkey = supplier.s_nationkey
        AND cust_region.r_name = 'ASIA'
        AND orders.o_orderdate BETWEEN DATE '1994-01-01' AND DATE '1994-12-31'
      GROUP BY cust_nation.n_name

  - id: m04
    tier: multi_step
    question: >-
      How much more revenue would there have been on line items shipped in 1994 if discounts between 0.05 and 0.07
      had not been given on lines with quantity below 24?
    gold_sql: |
      SELECT SUM(lineitem.l_extendedprice * lineitem.l_discount) AS revenue_change
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      WHERE lineitem.l_shipdate BETWEEN DATE '1994-01-01' AND DATE '1994-12-31'
        AND lineitem.l_discount BETWEEN 0.05 AND 0.07
        AND lineitem.l_quantity < 24

  - id: m05
    tier: multi_step
    question: What percentage of revenue from line items shipped in September 1995 came from PROMO parts?
    paraphrases:
      - "Share of September 1995 shipped revenue from promotional parts"
    percent: true
    gold_sql: |
      SELECT SUM(CASE WHEN part.p_type ILIKE 'PROMO%' THEN lineitem.l_extendedprice * (1 - lineitem.l_discount) ELSE 0 END)
             / SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS promo_share
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.PART AS part ON lineitem.l_partkey = part.p_partkey
      WHERE lineitem.l_shipdate BETWEEN DATE '1995-09-01' AND DATE '1995-09-30'

  - id: m06
    tier: multi_step
    question: Which customers placed more than 38 orders? Show the customer name and their number of orders.
    paraphrases:
      - "List customers with over 38 orders and their order counts"
    gold_sql: |
      SELECT customer.c_name, COUNT(*) AS order_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      JOIN DATAMIND_DB.TPCH.CUSTOMER AS customer ON orders.o_custkey = customer.c_custkey
      GROUP BY customer.c_name
      HAVING COUNT(*) > 38

  - id: m07
    tier: multi_step
    question: Among customers who ordered in 1996, what was the average number of orders per customer that year?
    paraphrases:
      - "Average orders per active customer in 1996"
    gold_sql: |
      WITH per_customer AS (
        SELECT orders.o_custkey, COUNT(*) AS n_orders
        FROM DATAMIND_DB.TPCH.ORDERS AS orders
        WHERE orders.o_orderdate BETWEEN DATE '1996-01-01' AND DATE '1996-12-31'
        GROUP BY orders.o_custkey
      )
      SELECT AVG(n_orders) AS avg_orders_per_customer FROM per_customer

  - id: m08
    tier: multi_step
    question: How many customers have never placed an order?
    paraphrases:
      - "Number of customers with no orders at all"
    gold_sql: |
      SELECT COUNT(*) AS customers_without_orders
      FROM DATAMIND_DB.TPCH.CUSTOMER AS customer
      WHERE NOT EXISTS (SELECT 1 FROM DATAMIND_DB.TPCH.ORDERS AS orders WHERE orders.o_custkey = customer.c_custkey)

  - id: m09
    tier: multi_step
    question: For each order year, what fraction of line items were received after their commit date?
    paraphrases:
      - "Late delivery rate by year of order"
    ordered: true
    gold_sql: |
      SELECT AVG(CASE WHEN lineitem.l_receiptdate > lineitem.l_commitdate THEN 1.0 ELSE 0.0 END) AS late_line_rate
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      GROUP BY YEAR(orders.o_orderdate)
      ORDER BY YEAR(orders.o_orderdate)

  - id: m10
    tier: multi_step
    question: Which 5 suppliers made the most profit on parts whose type contains BRASS?
    paraphrases:
      - "Top five suppliers by margin on brass parts"
    gold_sql: |
      SELECT supplier.s_name,
             SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount) - partsupp.ps_supplycost * lineitem.l_quantity) AS profit
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.PARTSUPP AS partsupp ON lineitem.l_partkey = partsupp.ps_partkey AND lineitem.l_suppkey = partsupp.ps_suppkey
      JOIN DATAMIND_DB.TPCH.PART AS part ON lineitem.l_partkey = part.p_partkey
      JOIN DATAMIND_DB.TPCH.SUPPLIER AS supplier ON lineitem.l_suppkey = supplier.s_suppkey
      WHERE part.p_type ILIKE '%BRASS%'
      GROUP BY supplier.s_name
      ORDER BY profit DESC
      LIMIT 5

  - id: m11
    tier: multi_step
    question: By what percentage did revenue grow from 1995 to 1996?
    paraphrases:
      - "Year-over-year revenue growth between 1995 and 1996"
    percent: true
    gold_sql: |
      WITH yearly AS (
        SELECT YEAR(orders.o_orderdate) AS yr, SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
        FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
        JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
        WHERE orders.o_orderdate BETWEEN DATE '1995-01-01' AND DATE '1996-12-31'
        GROUP BY YEAR(orders.o_orderdate)
      )
      SELECT (MAX(CASE WHEN yr = 1996 THEN revenue END) - MAX(CASE WHEN yr = 1995 THEN revenue END))
             / MAX(CASE WHEN yr = 1995 THEN revenue END) AS growth
      FROM yearly

  - id: m12
    tier: multi_step
    question: Which customer region had the highest average order value in 1997?
    paraphrases:
      - "In 1997, customers from which region placed the largest orders on average?"
    gold_sql: |
      SELECT cust_region.r_name, AVG(orders.o_totalprice) AS avg_order_value
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      JOIN DATAMIND_DB.TPCH.CUSTOMER AS customer ON orders.o_custkey = customer.c_custkey
      JOIN DATAMIND_DB.TPCH.NATION AS cust_nation ON customer.c_nationkey = cust_nation.n_nationkey
      JOIN DATAMIND_DB.TPCH.REGION AS cust_region ON cust_nation.n_regionkey = cust_region.r_regionkey
      WHERE orders.o_orderdate BETWEEN DATE '1997-01-01' AND DATE '1997-12-31'
      GROUP BY cust_region.r_name
      ORDER BY avg_order_value DESC
      LIMIT 1

  # ------------------------------------------------------------------ time
  - id: t01
    tier: time
    question: How many orders were placed each year?
    paraphrases:
      - "Yearly order counts"
    gold_sql: |
      SELECT YEAR(orders.o_orderdate) AS order_year, COUNT(*) AS order_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      GROUP BY YEAR(orders.o_orderdate)

  - id: t02
    tier: time
    question: What was revenue in each quarter of 1996?
    paraphrases:
      - "Quarterly sales for 1996"
    ordered: true
    gold_sql: |
      SELECT SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      WHERE orders.o_orderdate BETWEEN DATE '1996-01-01' AND DATE '1996-12-31'
      GROUP BY QUARTER(orders.o_orderdate)
      ORDER BY QUARTER(orders.o_orderdate)

  - id: t03
    tier: time
    question: How many orders were placed in each month of 1997?
    paraphrases:
      - "Monthly order volume in 1997"
    ordered: true
    gold_sql: |
      SELECT COUNT(*) AS order_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      WHERE orders.o_orderdate BETWEEN DATE '1997-01-01' AND DATE '1997-12-31'
      GROUP BY MONTH(orders.o_orderdate)
      ORDER BY MONTH(orders.o_orderdate)

  - id: t04
    tier: time
    question: In which year was revenue the highest, and how much was it?
    paraphrases:
      - "Best year for sales and its revenue"
    gold_sql: |
      SELECT YEAR(orders.o_orderdate) AS order_year, SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      JOIN DATAMIND_DB.TPCH.ORDERS AS orders ON lineitem.l_orderkey = orders.o_orderkey
      GROUP BY YEAR(orders.o_orderdate)
      ORDER BY revenue DESC
      LIMIT 1

  - id: t05
    tier: time
    question: How many orders were placed in the first quarter of 1993?
    paraphrases:
      - "Order count for Q1 1993"
    gold_sql: |
      SELECT COUNT(*) AS order_count
      FROM DATAMIND_DB.TPCH.ORDERS AS orders
      WHERE orders.o_orderdate BETWEEN DATE '1993-01-01' AND DATE '1993-03-31'

  - id: t06
    tier: time
    question: What was the total revenue of line items shipped in December 1998?
    gold_sql: |
      SELECT SUM(lineitem.l_extendedprice * (1 - lineitem.l_discount)) AS revenue
      FROM DATAMIND_DB.TPCH.LINEITEM AS lineitem
      WHERE lineitem.l_shipdate BETWEEN DATE '1998-12-01' AND DATE '1998-12-31'

  # ------------------------------------------------------------------ ambiguous: clarify, or answer with an explicit assumption
  - {id: a01, tier: ambiguous, question: "Who are our best customers?", expect: clarify_or_assume}
  - {id: a02, tier: ambiguous, question: "Which region performs best?", expect: clarify_or_assume}
  - {id: a03, tier: ambiguous, question: "Show me the biggest orders", expect: clarify_or_assume}
  - {id: a04, tier: ambiguous, question: "How are sales doing?", expect: clarify_or_assume}

  # ------------------------------------------------------------------ not answerable from this data
  - {id: n01, tier: not_in_data, question: "What is the average delivery driver rating?", expect: not_in_data}
